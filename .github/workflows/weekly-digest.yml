name: weekly-digest

"on":
  schedule:
    - cron: "33 16 * * 5" # Fridays 16:33 UTC ≈ 19:33 MSK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect weekly GitHub digest and send to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: .github/scripts/weekly_digest.sh

      - name: Commit followers state if changed
        run: |
          git config user.name "0x3654"
          git config user.email "143552327+0x3654@users.noreply.github.com"
          git add state/followers.json
          if git diff --cached --quiet; then
            echo "No followers state changes."
          else
            git commit -m "Update followers state"
            git push
          fi
