name: snake

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: "0x3654"
          outputs: |
            dist/snake.gif
            dist/snake_dark.gif?palette=github-dark

      - name: Push snake-output branch
        run: |
          git config user.name "0x3654"
          git config user.email "143552327+0x3654@users.noreply.github.com"
          git checkout -f --orphan snake-output
          git add -f dist/
          git commit -m "update snake" || exit 0
          git push -f origin snake-output
