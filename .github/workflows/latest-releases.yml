name: auto-blocks

on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths: ["README.md", ".github/scripts/", ".github/workflows/latest-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-blocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh latest releases blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/latest_releases.sh README.md

      - name: Refresh popular repos blocks
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/popular_repos.sh README.md

      - name: Commit and push if changed
        run: |
          git config user.name "0x3654"
          git config user.email "143552327+0x3654@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No block changes."
          else
            git commit -m "Update profile auto blocks"
            git push
          fi
